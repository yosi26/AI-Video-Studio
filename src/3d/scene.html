<style>

  @font-face { font-family: Heebo; font-weight: 900; src: url(/assets/fonts/heebo-hebrew-900-normal.woff2) format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
  @font-face { font-family: Heebo; font-weight: 400; src: url(/assets/fonts/heebo-latin-400-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }

  :root { --primary: #ff6b35; --accent: #ffd23f; --bg: #05050c; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  body { font-family: Heebo, sans-serif; color: #fff; position: relative; }
  canvas { position: absolute; inset: 0; }
  #overlay { position: absolute; inset: 0; pointer-events: none; }
  .ov { position: absolute; left: 80px; right: 80px; text-align: center; opacity: 0;
        text-shadow: 0 4px 30px rgba(0,0,0,.85), 0 0 2px rgba(0,0,0,.9); }
  .tagline { top: 1260px; font-size: 64px; font-weight: 700; line-height: 1.3; }
  .svc-text { top: 1400px; font-size: 58px; font-weight: 400; line-height: 1.35; }
  .offer-sub { top: 1400px; font-size: 64px; font-weight: 700; }
  .contacts { top: 1140px; }
  .contact { font-size: 58px; font-weight: 700; margin: 14px 0; overflow-wrap: anywhere; }
  .contact bdi { font-size: .82em; }
  .contact .lbl { color: var(--accent); }
  .btn { display: inline-block; margin-top: 50px; background: var(--primary); border-radius: 100px; padding: 36px 90px;
         font-size: 70px; font-weight: 900; box-shadow: 0 0 60px var(--primary); text-shadow: none; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
  #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.65)); }
  #progress { position: absolute; top: 0; right: 0; height: 12px; background: var(--accent); box-shadow: 0 0 20px var(--accent); }

  <div id="overlay"></div>

  <div id="flash"></div>
  <div id="progress"></div>
