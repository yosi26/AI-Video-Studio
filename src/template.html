<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Heebo; font-weight: 400; src: url(../assets/fonts/heebo-hebrew-400-normal.woff2) format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
  @font-face { font-family: Heebo; font-weight: 700; src: url(../assets/fonts/heebo-hebrew-700-normal.woff2) format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
  @font-face { font-family: Heebo; font-weight: 900; src: url(../assets/fonts/heebo-hebrew-900-normal.woff2) format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
  @font-face { font-family: Heebo; font-weight: 400; src: url(../assets/fonts/heebo-latin-400-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
  @font-face { font-family: Heebo; font-weight: 700; src: url(../assets/fonts/heebo-latin-700-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
  @font-face { font-family: Heebo; font-weight: 900; src: url(../assets/fonts/heebo-latin-900-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }

  :root { --primary: #ff6b35; --accent: #ffd23f; --bg: #1a1a2e; --text: #ffffff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
  body { font-family: Heebo, "DejaVu Sans", sans-serif; color: var(--text); position: relative; }

  #bg, #photo, #shade, .blob, .scene { position: absolute; inset: 0; }
  #bg { background: var(--bg); }
  .blob { width: 900px; height: 900px; border-radius: 50%; filter: blur(120px); opacity: .55; inset: auto; }
  #photo { background-size: cover; background-position: center; opacity: 0; }
  #shade { background: linear-gradient(180deg, rgba(0,0,0,.55), rgba(0,0,0,.25) 40%, rgba(0,0,0,.7)); opacity: 0; }

  #progress { position: absolute; top: 0; right: 0; height: 14px; background: var(--accent); z-index: 10; }
  #wipe { position: absolute; top: 0; bottom: 0; width: 1400px; background: var(--primary); z-index: 9; transform: skewX(-12deg); }

  .scene { display: flex; flex-direction: column; align-items: center; justify-content: center;
           padding: 260px 90px 380px; text-align: center; opacity: 0; }
  .word { display: inline-block; }
  .hook { font-size: 118px; font-weight: 900; line-height: 1.15; }
  .hook .hl { color: var(--accent); }

  .logo { width: 360px; height: 360px; object-fit: contain; margin-bottom: 60px; }
  .monogram { width: 300px; height: 300px; border-radius: 50%; background: var(--primary); display: flex;
              align-items: center; justify-content: center; font-size: 170px; font-weight: 900; margin-bottom: 70px;
              box-shadow: 0 0 0 18px rgba(255,255,255,.12); }
  .name { font-size: 132px; font-weight: 900; line-height: 1.05; }
  .rule { height: 12px; background: var(--accent); border-radius: 6px; margin: 50px 0; }
  .tagline { font-size: 68px; font-weight: 400; line-height: 1.3; }

  .num { font-size: 260px; font-weight: 900; line-height: 1; color: var(--accent); }
  .svc-title { font-size: 104px; font-weight: 900; margin: 30px 0 40px; line-height: 1.1; }
  .svc-text { font-size: 60px; font-weight: 400; line-height: 1.35; opacity: .92; }

  .badge { background: var(--accent); color: var(--bg); border-radius: 60px; padding: 70px 80px;
           font-size: 112px; font-weight: 900; line-height: 1.1; transform: rotate(-3deg); }
  .offer-sub { font-size: 64px; font-weight: 700; margin-top: 80px; line-height: 1.3; }

  .cta { font-size: 100px; font-weight: 900; line-height: 1.1; margin-bottom: 70px; }
  .contact { font-size: 60px; font-weight: 700; margin: 16px 0; }
  .contact .lbl { color: var(--accent); }
  .btn { margin-top: 70px; background: var(--primary); border-radius: 100px; padding: 40px 90px;
         font-size: 72px; font-weight: 900; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
</style>
</head>
<body>
  <div id="bg"></div>
  <div class="blob" id="b1"></div>
  <div class="blob" id="b2"></div>
  <div id="photo"></div>
  <div id="shade"></div>
  <div id="stage"></div>
  <div id="wipe"></div>
  <div id="progress"></div>

<script>
const DURATION = 30;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, start, len) => clamp((t - start) / len);
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeBack = x => { const c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const words = (s, cls = "") => esc(s).split(/\s+/).filter(Boolean).map(w => `<span class="word ${cls}">${w}</span>`).join(" ");

let scenes = [];
let photos = [];

// Each scene: [start, end, element, animate(localT, el)]
function init(cfg) {
  const root = document.documentElement.style;
  const c = cfg.colors || {};
  if (c.primary) root.setProperty("--primary", c.primary);
  if (c.accent) root.setProperty("--accent", c.accent);
  if (c.background) root.setProperty("--bg", c.background);
  document.getElementById("b1").style.background = "var(--primary)";
  document.getElementById("b2").style.background = "var(--accent)";
  photos = cfg.images || [];

  const stage = document.getElementById("stage");
  const add = html => { const d = document.createElement("div"); d.className = "scene"; d.innerHTML = html; stage.appendChild(d); return d; };

  // hook text: words wrapped in *stars* get the highlight color
  const hookHtml = esc(cfg.hook).split(/\s+/).filter(Boolean).map(w => {
    const hl = /^\*.*\*$/.test(w);
    return `<span class="word ${hl ? "hl" : ""}">${hl ? w.slice(1, -1) : w}</span>`;
  }).join(" ");

  const services = (cfg.services || []).slice(0, 3);
  const svcLen = 11 / Math.max(1, services.length);
  const contact = cfg.contact || {};
  const lines = [
    ["טלפון", contact.phone, true], ["וואטסאפ", contact.whatsapp, true], ["אתר", contact.website, true],
    ["אינסטגרם", contact.instagram, true], ["כתובת", contact.address, false],
  ].filter(([, v]) => v);

  const brandMark = cfg.logo
    ? `<img class="logo" src="${cfg.logo}">`
    : `<div class="monogram">${esc((cfg.name || "?").trim()[0])}</div>`;

  scenes = [
    [0, 4.5, add(`<div class="hook">${hookHtml}</div>`), (t, el) => {
      el.querySelectorAll(".word").forEach((w, i) => {
        const p = easeBack(prog(t, 0.15 + i * 0.18, 0.5));
        w.style.opacity = clamp(p * 1.5);
        w.style.transform = `translateY(${(1 - p) * 120}px) scale(${0.7 + 0.3 * p})`;
      });
    }],
    [4.5, 9, add(`${brandMark}<div class="name">${words(cfg.name)}</div><div class="rule"></div><div class="tagline">${esc(cfg.tagline)}</div>`), (t, el) => {
      const m = el.firstElementChild, p = easeBack(prog(t, 0, 0.7));
      m.style.transform = `scale(${p}) rotate(${(1 - p) * -90}deg)`;
      el.querySelectorAll(".name .word").forEach((w, i) => {
        const q = easeOut(prog(t, 0.5 + i * 0.12, 0.5));
        w.style.opacity = q; w.style.transform = `translateY(${(1 - q) * 80}px)`;
      });
      el.querySelector(".rule").style.width = `${easeOut(prog(t, 1.0, 0.6)) * 420}px`;
      const tg = el.querySelector(".tagline"), q = easeOut(prog(t, 1.3, 0.6));
      tg.style.opacity = q; tg.style.transform = `translateY(${(1 - q) * 50}px)`;
    }],
    ...services.map((s, i) => [9 + i * svcLen, 9 + (i + 1) * svcLen,
      add(`<div class="num">0${i + 1}</div><div class="svc-title">${esc(s.title)}</div><div class="svc-text">${esc(s.text)}</div>`),
      (t, el) => {
        const [n, ti, tx] = el.children;
        const a = easeBack(prog(t, 0, 0.5)), b = easeOut(prog(t, 0.25, 0.5)), c = easeOut(prog(t, 0.55, 0.5));
        n.style.transform = `scale(${a})`;
        ti.style.opacity = b; ti.style.transform = `translateX(${(1 - b) * -300}px)`;
        tx.style.opacity = c; tx.style.transform = `translateX(${(1 - c) * -300}px)`;
      }]),
    [20, 25, add(`<div class="badge">${esc(cfg.offer)}</div><div class="offer-sub">${esc(cfg.offerSub)}</div>`), (t, el) => {
      const [b, s] = el.children, p = easeBack(prog(t, 0, 0.6));
      const pulse = 1 + 0.035 * Math.sin(Math.max(0, t - 0.6) * 6);
      b.style.transform = `rotate(${-3 - (1 - p) * 20}deg) scale(${p * pulse})`;
      const q = easeOut(prog(t, 0.6, 0.5));
      s.style.opacity = q; s.style.transform = `translateY(${(1 - q) * 60}px)`;
    }],
    [25, 30.1, add(`<div class="cta">${esc(cfg.cta)}</div>${lines.map(([k, v, ltr]) => `<div class="contact"><span class="lbl">${k}:</span> <bdi dir="${ltr ? "ltr" : "auto"}">${esc(v)}</bdi></div>`).join("")}<div class="btn">${esc(cfg.button || cfg.name)}</div>`), (t, el) => {
      const kids = [...el.children];
      kids.forEach((k, i) => {
        const q = easeOut(prog(t, 0.1 + i * 0.2, 0.5));
        k.style.opacity = q; k.style.transform = `translateY(${(1 - q) * 70}px)`;
      });
      const btn = kids[kids.length - 1];
      const q = easeBack(prog(t, 0.1 + (kids.length - 1) * 0.2, 0.5));
      btn.style.transform = `scale(${q * (1 + 0.05 * Math.sin(Math.max(0, t - 1.5) * 7))})`;
    }],
  ];
}

function render(t) {
  // drifting background blobs
  const b1 = document.getElementById("b1").style, b2 = document.getElementById("b2").style;
  b1.left = `${-300 + 250 * Math.sin(t * 0.35)}px`; b1.top = `${-200 + 300 * Math.cos(t * 0.25)}px`;
  b2.left = `${400 + 250 * Math.cos(t * 0.3)}px`;   b2.top = `${1100 + 250 * Math.sin(t * 0.4)}px`;

  // optional photos: one per ~6s, slow Ken Burns zoom
  const photo = document.getElementById("photo").style, shade = document.getElementById("shade").style;
  if (photos.length) {
    const slot = DURATION / photos.length, idx = Math.min(photos.length - 1, Math.floor(t / slot)), lt = t - idx * slot;
    photo.backgroundImage = `url("${photos[idx]}")`;
    photo.transform = `scale(${1.05 + 0.12 * (lt / slot)})`;
    photo.opacity = clamp(Math.min(lt / 0.5, (slot - lt) / 0.5 + (idx === photos.length - 1 ? 1 : 0)));
    shade.opacity = 1;
  }

  // scene visibility with cross-fade
  for (const [start, end, el, anim] of scenes) {
    const on = t >= start - 0.001 && t < end;
    el.style.opacity = on ? clamp(Math.min((t - start) / 0.25, (end - t) / 0.25)) : 0;
    el.style.display = on ? "flex" : "none";
    if (on) anim(t - start, el);
  }

  // colored wipe sweeping across at each scene boundary
  const cuts = scenes.slice(1).map(s => s[0]);
  const near = cuts.find(c => Math.abs(t - c) < 0.35);
  const wipe = document.getElementById("wipe").style;
  wipe.right = near === undefined ? "-2000px" : `${-1500 + ((t - near + 0.35) / 0.7) * 3000}px`;

  document.getElementById("progress").style.width = `${(t / DURATION) * 1080}px`;
}
</script>
</body>
</html>
