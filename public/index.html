<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Video Studio</title>
  <style>
    :root {
      --bg: #f6f6f4; --surface: #fff; --text: #1c1c1a; --muted: #6b6a65;
      --border: #dddcd6; --accent: #4f46e5; --accent-text: #fff; --danger: #b42318;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #151514; --surface: #1f1f1d; --text: #ededea; --muted: #a09f99;
              --border: #34332f; --accent: #8b85ff; --accent-text: #111; --danger: #ff8a7a; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
           font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 1100px; margin: 0 auto; padding: 32px 16px; display: grid; gap: 24px;
           grid-template-columns: minmax(0, 420px) minmax(0, 1fr); }
    @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
    header { grid-column: 1 / -1; }
    h1 { margin: 0; font-size: 24px; }
    header p { margin: 4px 0 0; color: var(--muted); }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
    form { display: grid; gap: 14px; }
    label { display: grid; gap: 6px; font-weight: 600; font-size: 13px; }
    textarea, select, input[type=number] { font: inherit; color: inherit; background: var(--bg);
           border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; width: 100%; }
    textarea { min-height: 120px; resize: vertical; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .check { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; }
    .range { display: flex; gap: 10px; align-items: center; }
    .range input[type=range] { flex: 1; }
    .range output { min-width: 3ch; text-align: right; font-variant-numeric: tabular-nums; }
    .cost { color: var(--muted); font-size: 13px; }
    button { font: inherit; font-weight: 600; border: 0; border-radius: 8px; padding: 10px 16px; cursor: pointer;
             background: var(--accent); color: var(--accent-text); }
    button.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .result { display: grid; gap: 12px; align-content: start; }
    .stage { aspect-ratio: 16 / 9; background: #000; border-radius: 8px; display: grid; place-items: center;
             color: #aaa; overflow: hidden; }
    .stage video { width: 100%; height: 100%; object-fit: contain; }
    .status { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; }
    .error { color: var(--danger); }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .actions a { color: var(--accent); font-weight: 600; }
    .hidden { display: none; }
  </style>
</head>
<body>
<main>
  <header>
    <h1>AI Video Studio</h1>
    <p>Text-to-video with Seedance 2.5</p>
  </header>

  <section class="card">
    <form id="form">
      <label>Prompt
        <textarea name="prompt" required placeholder="A cinematic scene at sunset"></textarea>
      </label>
      <label>Duration (seconds)
        <span class="range">
          <input type="range" name="duration" min="4" max="30" step="1" value="5">
          <output id="durationOut">5</output>
        </span>
      </label>
      <div class="row">
        <label>Resolution
          <select name="resolution"><option>480p</option><option selected>720p</option><option>1080p</option></select>
        </label>
        <label>Aspect ratio
          <select name="aspect_ratio">
            <option selected>16:9</option><option>4:3</option><option>1:1</option>
            <option>3:4</option><option>9:16</option><option>21:9</option>
          </select>
        </label>
      </div>
      <div class="row">
        <label>Bitrate
          <select name="bitrate_mode"><option>standard</option><option selected>high</option></select>
        </label>
        <label>Format
          <select name="output_format"><option selected>mp4</option><option>mov</option></select>
        </label>
      </div>
      <label class="check"><input type="checkbox" name="generate_audio" checked> Generate audio</label>
      <div class="cost" id="cost"></div>
      <button type="submit" id="submit">Generate video</button>
    </form>
  </section>

  <section class="card result">
    <div class="stage" id="stage"><span>Your video will appear here</span></div>
    <div class="status">
      <span id="status">Idle</span>
      <button type="button" class="secondary hidden" id="cancel">Cancel</button>
    </div>
    <div class="actions hidden" id="actions"><a id="download" target="_blank" rel="noopener">Open / download video</a></div>
  </section>
</main>

<script>
  const form = document.getElementById('form');
  const $ = (id) => document.getElementById(id);
  const LABELS = { queued: 'Queued…', in_progress: 'Generating…', completed: 'Done', failed: 'Failed',
                   nsfw: 'Blocked: content flagged as NSFW', canceled: 'Canceled' };
  const TERMINAL = new Set(['completed', 'failed', 'nsfw', 'canceled']);
  let current = null;

  function formInput() {
    const data = new FormData(form);
    return {
      prompt: data.get('prompt'),
      duration: Number(data.get('duration')),
      resolution: data.get('resolution'),
      aspect_ratio: data.get('aspect_ratio'),
      bitrate_mode: data.get('bitrate_mode'),
      output_format: data.get('output_format'),
      generate_audio: data.get('generate_audio') === 'on',
    };
  }

  async function api(path, body) {
    const res = await fetch(path, body === undefined ? {} : {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    });
    const json = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(json.error || `HTTP ${res.status}`);
    return json;
  }

  function setStatus(text, isError = false) {
    $('status').textContent = text;
    $('status').classList.toggle('error', isError);
  }

  async function updateCost() {
    $('durationOut').textContent = form.duration.value;
    const { prompt, ...opts } = formInput();
    try {
      const { usd, tokens, exact } = await api('/api/estimate', opts);
      $('cost').textContent = `Estimated cost: ${exact ? '' : '~'}$${usd.toFixed(2)} · ${tokens.toLocaleString()} video tokens`;
    } catch { $('cost').textContent = ''; }
  }

  function setStageRatio() {
    const [w, h] = form.aspect_ratio.value.split(':');
    $('stage').style.aspectRatio = `${w} / ${h}`;
  }

  function showVideo(url) {
    const video = document.createElement('video');
    video.src = url; video.controls = true; video.autoplay = true; video.playsInline = true;
    $('stage').replaceChildren(video);
    $('download').href = url;
    $('actions').classList.remove('hidden');
  }

  async function poll(id) {
    while (current === id) {
      const s = await api(`/api/requests/${id}`);
      if (current !== id) return;
      setStatus(s.error ? `${LABELS[s.status]}: ${s.error}` : (LABELS[s.status] || s.status), s.status !== 'completed' && TERMINAL.has(s.status));
      if (TERMINAL.has(s.status)) {
        if (s.status === 'completed') showVideo(s.video.url);
        return;
      }
      await new Promise((r) => setTimeout(r, 4000));
    }
  }

  form.addEventListener('input', () => { updateCost(); setStageRatio(); });
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    $('submit').disabled = true;
    $('actions').classList.add('hidden');
    $('stage').replaceChildren(Object.assign(document.createElement('span'), { textContent: 'Rendering…' }));
    setStatus('Submitting…');
    try {
      const queued = await api('/api/generate', formInput());
      current = queued.request_id;
      $('cancel').classList.remove('hidden');
      await poll(current);
    } catch (err) {
      setStatus(err.message, true);
    } finally {
      current = null;
      $('submit').disabled = false;
      $('cancel').classList.add('hidden');
    }
  });
  $('cancel').addEventListener('click', async () => {
    if (!current) return;
    try { await api(`/api/requests/${current}/cancel`, {}); } catch (err) { setStatus(err.message, true); }
  });

  updateCost();
</script>
</body>
</html>
